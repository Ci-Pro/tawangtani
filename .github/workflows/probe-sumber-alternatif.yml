name: probe-sumber-alternatif

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-sumber-alternatif.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Uji beberapa sumber harga alternatif
        run: |
          test_url () {
            KODE=$(curl -sS -o /tmp/t.html -m 20 -w "%{http_code}" -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$1" || echo "000")
            UKURAN=$(wc -c < /tmp/t.html || echo 0)
            echo "$2 -> HTTP $KODE (${UKURAN} bytes)"
          }
          test_url "https://panelharga.badanpangan.go.id/data/provinsi/level-harga" "BadanPangan-provinsi"
          test_url "https://panelharga.badanpangan.go.id/" "BadanPangan-home"
          test_url "https://hargapangan.id/" "HargaPangan-id"
          test_url "https://sp2kp.kemendag.go.id/" "Kemendag-SP2KP"
          test_url "https://biroekonomi.pertanian.go.id/" "Pertanian-biroekonomi"
          test_url "https://app4.pertanian.go.id/panelharga/" "Pertanian-app4"
