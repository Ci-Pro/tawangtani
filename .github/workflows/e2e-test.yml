name: e2e-test

# Uji end-to-end seluruh perjalanan pengguna terhadap produksi pasca-deploy.
# Tidak butuh secret: anon key Supabase adalah kunci publik klien.
on:
  workflow_dispatch:
    inputs:
      skip_ai:
        description: 'Lewati panggilan AI (hemat kuota)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/e2e-test.yml'

concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://tawangtani-flame.vercel.app
      SUPABASE_URL: https://bpiqgbjlwkdpnlgvxdrx.supabase.co
      # Anon key adalah kunci publik klien, tapi jangan hardcode di repo —
      # pakai secret org (Repository secrets → SUPABASE_ANON_KEY).
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SKIP_AI: ${{ github.event.inputs.skip_ai == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan E2E lengkap
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_ANON_KEY belum dikonfigurasi — lewati e2e ini. Tambahkan secret lalu re-run."
            exit 0
          fi
          node backend/scripts/e2e.mjs
