name: probe-kemendag

# Uji sekali jalan: apakah API publik SP2KP Kemendag bisa diakses dari runner cloud?
# Jika 200, sinkron harga harian bisa diotomasi penuh di GitHub Actions tanpa PC.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tes endpoint publik SP2KP
        run: |
          B="https://api-sp2kp.kemendag.go.id/report/api"
          echo "== waktu-server";   curl -s -m 20 -o /dev/null -w "%{http_code}\n" "$B/../master/api/waktu-server" || true
          echo "== latest-price-dates"
          curl -s -m 25 -w "\nHTTP %{http_code}\n" "$B/latest-price-dates" | head -c 400; echo
          echo "== average-price-public (hari ini)"
          T=$(date -u +%F)
          curl -s -m 30 "$B/average-price-public" \
            --get --data-urlencode "filter=[\"tanggal\",\"$T\"]" --data-urlencode "take=3" \
            -w "\nHTTP %{http_code}\n" | head -c 600; echo
          echo "== komoditas master"
          curl -s -m 20 -o /dev/null -w "%{http_code}\n" "$B/../../../master/api/komoditas" || true
